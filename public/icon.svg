<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Wheat / Maize Sheaf Iconography -->
  <g transform="translate(100, 70)">
    <!-- Soil base -->
    <path d="M 20 330 Q 156 310 292 330 Q 156 350 20 330 Z" fill="#78350f" opacity="0.6"/>
    
    <!-- Central Stalk -->
    <path d="M 156 320 Q 156 180 156 40" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" fill="none"/>
    
    <!-- Leaves Left -->
    <path d="M 156 260 Q 70 240 50 180 Q 110 180 156 220" fill="#10b981"/>
    <path d="M 156 180 Q 80 160 65 110 Q 120 110 156 150" fill="#34d399"/>
    
    <!-- Leaves Right -->
    <path d="M 156 240 Q 242 220 262 160 Q 202 160 156 200" fill="#10b981"/>
    <path d="M 156 160 Q 232 140 247 90 Q 192 90 156 130" fill="#34d399"/>
    
    <!-- Maize Head / Seed Ear -->
    <ellipse cx="156" cy="70" rx="32" ry="55" fill="url(#gold)"/>
    
    <!-- Sun Ray Badge -->
    <circle cx="250" cy="50" r="30" fill="#fef08a" opacity="0.8"/>
  </g>
</svg>
