    <script>
      (function() {
        // AI Studio Preview: HMR is disabled and WebSockets are not forwarded through proxy iframe.
        // Mock vite-hmr socket so Vite client resolves cleanly without "WebSocket closed without opened".
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) {
              isViteHmr = true;
            } else if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) {
              isViteHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1)) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var fake = new EventTarget();
              fake.url = url;
              fake.protocol = 'vite-hmr';
              fake.readyState = 1; // WebSocket.OPEN
              fake.OPEN = 1;
              fake.CLOSED = 3;
              fake.CLOSING = 2;
              fake.CONNECTING = 0;
              fake.send = function() {};
              fake.close = function() {};
              fake.onopen = null;
              fake.onclose = null;
              fake.onerror = null;
              fake.onmessage = null;
              setTimeout(function() {
                var ev = new Event('open');
                fake.dispatchEvent(ev);
                if (typeof fake.onopen === 'function') fake.onopen(ev);
              }, 0);
              return fake;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('closed without opened') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && e.reason.message && (e.reason.message.indexOf('WebSocket') !== -1 || e.reason.message.indexOf('closed without opened') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
